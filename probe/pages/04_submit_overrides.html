<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>04 submit button overrides</title></head>
<body>
<form action="/submit/04-default" method="get">
  <input type="text" name="q" value="1">
  <button type="submit" name="btn" value="rel"
          formaction="/submit/04-override" formmethod="post">rel</button>
  <button type="submit" name="btn2" value="plain"
          formmethod="post" formenctype="text/plain">plain</button>
</form>
</body></html>
